// Per-volunteer PDF from the local session log. No network needed.
// Filters to today's local date so a second session never sees stale contacts.
function generateMyReport() {
  if (!log.length) { alert('No contacts logged yet.'); return; }

  const today   = new Date();
  const todayY  = today.getFullYear();
  const todayM  = today.getMonth();
  const todayD  = today.getDate();
  const todayLog = log.filter(r => {
    if (!r.iso) return false;
    const d = new Date(r.iso);
    return d.getFullYear() === todayY && d.getMonth() === todayM && d.getDate() === todayD;
  });

  if (!todayLog.length) {
    alert('No contacts logged today. (Older entries are still in the log for CSV export.)');
    return;
  }

  const agg       = aggregateContacts(todayLog);
  const canvasser = cfg.canvasser || 'Volunteer';
  const dateStr   = today.toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
  const inner = statsBlockHtml(agg, `My Shift · ${canvasser} · ${dateStr}`);
  printReportHtml(wrapReportHtml(cfg.orgName || 'Campaign', canvasser + ' · Shift Report', inner));
}

// Campaign-wide PDF. Admin only.
// Flow: picker first (no network yet) → fetch with server-side date params
// → client-side precision filter as safety net → render.
async function generateCampaignReport() {
  if (!isAdmin()) {
    alert('Campaign reports are restricted to admin accounts.');
    return;
  }
  if (!cfg.endpoint) {
    alert('No Google Sheets endpoint configured. Add the Apps Script URL in Campaign Setup.');
    return;
  }

  // Show picker before any network call — user sees UI immediately.
  // Resolves with { start: Date, end: Date|null, label: string } or null.
  const pick = await campaignReportPicker();
  if (!pick) return; // user cancelled

  const { start, end, label } = pick;
  const btn = document.getElementById('campaignReportBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Fetching data…'; }

  try {
    // Build URL with optional server-side date params (ISO strings, UTC).
    // Server filters before sending rows, keeping payloads small.
    // All Time sends no params → server returns every row.
    let url = cfg.endpoint + '?action=getLog' + (cfg.campaignId ? '&cid=' + encodeURIComponent(cfg.campaignId) : '');
    if (start) url += '&startDate=' + encodeURIComponent(start.toISOString());
    if (end)   url += '&endDate='   + encodeURIComponent(end.toISOString());

    const res  = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Server error');
    if (!data.rows || !data.rows.length) {
      alert('No contacts found for that date range.');
      return;
    }

    // Convert header + rows into objects
    const header   = data.header;
    let contacts = data.rows.map(row => {
      const obj = {};
      header.forEach((h, i) => { obj[h] = row[i] != null ? String(row[i]) : ''; });
      return obj;
    });

    // Precision client-side filter: the server filtered by UTC ISO comparison;
    // this re-checks with exact local-time boundaries to catch any edge cases.
    if (start || end) {
      contacts = contacts.filter(c => {
        const ts = c.Timestamp || c.LoggedAt || '';
        if (!ts) return false;
        const d = new Date(ts);
        if (isNaN(d)) return false;
        if (start && d < start) return false;
        if (end   && d > end)   return false;
        return true;
      });
    }

    if (!contacts.length) {
      alert('No contacts found for that date range.');
      return;
    }

    const filtered = contacts;

    // Group by canvasser name
    const byCanvasser = {};
    filtered.forEach(c => {
      const name = c.Canvasser || 'Unknown';
      if (!byCanvasser[name]) byCanvasser[name] = [];
      byCanvasser[name].push(c);
    });

    const overall  = aggregateContacts(filtered);
    const names    = Object.keys(byCanvasser).sort();
    const hasDonations = overall.donations > 0;

    // Per-volunteer table rows
    const tableRows = names.map(name => {
      const a = aggregateContacts(byCanvasser[name]);
      return `<tr>
        <td><b>${escHtml(name)}</b></td>
        <td>${a.total}</td>
        <td>${a.conversations}</td>
        <td>${a.rate}%</td>
        <td>${a.supporters}</td>
        <td>${a.committed}</td>
        <td>${a.yardSigns}</td>
        <td>${a.volunteers}</td>
        ${hasDonations ? `<td>${a.donations}</td>` : ''}
      </tr>`;
    }).join('');

    const inner = `
      ${statsBlockHtml(overall, `Campaign Summary · ${escHtml(label)}`)}
      <div class="dvdr"></div>
      <h2>Volunteer Breakdown — ${names.length} canvasser${names.length !== 1 ? 's' : ''}</h2>
      <table>
        <thead><tr>
          <th>Canvasser</th>
          <th>Attempts</th>
          <th>Convos</th>
          <th>Rate</th>
          <th>Supporters</th>
          <th>Committed</th>
          <th>Signs</th>
          <th>Vol.</th>
          ${hasDonations ? '<th>Donations</th>' : ''}
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>`;

    printReportHtml(wrapReportHtml(cfg.orgName || 'Campaign', 'Campaign Report · ' + label, inner));

  } catch(err) {
    alert('Could not fetch campaign data: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Campaign Report (PDF)'; }
  }
}

// Render a date-range picker inside the log sheet and resolve with
// { start: Date, end: Date|null, label: string } or null if cancelled.
// start/end are local-time boundaries passed as ISO strings to the server.
// All Time resolves with { start: null, end: null, label: 'All Time' }.
function campaignReportPicker() {
  return new Promise(resolve => {
    // Returns midnight-start and 23:59:59.999-end for a given local date.
    function localDayBounds(date) {
      const start = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0, 0);
      const end   = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 23, 59, 59, 999);
      return { start, end };
    }

    // Parse YYYY-MM-DD from <input type="date"> into a local Date (not UTC).
    function parseLocalDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    // Format a Date as YYYY-MM-DD for <input type="date"> default values.
    function toInputDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    const today    = new Date();
    const todayStr = toInputDate(today);

    // Inject picker UI at the top of the log sheet's scroll area.
    const scrollEl = document.querySelector('#sheet .scroll');
    if (!scrollEl) { resolve(null); return; }

    const pickerEl = document.createElement('div');
    pickerEl.id = 'campaignDatePicker';
    pickerEl.style.cssText = 'margin:16px 0 8px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;';
    pickerEl.innerHTML = `
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--blue);margin-bottom:12px;">
        Campaign Report · Date Range
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        <button class="ghost" id="crToday"   style="font-size:13px;padding:7px 14px;" onclick="crPickerSelect('today')">Today</button>
        <button class="ghost" id="crWeek"    style="font-size:13px;padding:7px 14px;" onclick="crPickerSelect('week')">This Week</button>
        <button class="ghost" id="crCustom"  style="font-size:13px;padding:7px 14px;" onclick="crPickerSelect('custom')">Custom Range</button>
        <button class="ghost" id="crAllTime" style="font-size:13px;padding:7px 14px;" onclick="crPickerSelect('alltime')">All Time</button>
      </div>
      <div id="crCustomInputs" style="display:none;margin-bottom:12px;">
        <label style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">From</label>
        <input type="date" id="crStart" value="${todayStr}"
          style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;width:100%;margin-bottom:8px;">
        <label style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">To</label>
        <input type="date" id="crEnd" value="${todayStr}"
          style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;width:100%;margin-bottom:8px;">
      </div>
      <div style="display:flex;gap:8px;">
        <button style="flex:1;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:10px 0;font-size:14px;font-weight:700;cursor:pointer;" onclick="crPickerConfirm()">Generate Report</button>
        <button class="ghost" style="padding:10px 18px;font-size:14px;" onclick="crPickerCancel()">Cancel</button>
      </div>`;

    scrollEl.insertBefore(pickerEl, scrollEl.firstChild);

    let selectedMode = null;

    function crPickerSelect(mode) {
      selectedMode = mode;
      ['crToday','crWeek','crCustom','crAllTime'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.style.background = ''; el.style.color = ''; el.style.borderColor = ''; }
      });
      const activeId = { today:'crToday', week:'crWeek', custom:'crCustom', alltime:'crAllTime' }[mode];
      const active = document.getElementById(activeId);
      if (active) {
        active.style.background  = 'var(--blue)';
        active.style.color       = '#fff';
        active.style.borderColor = 'var(--blue)';
      }
      const customInputs = document.getElementById('crCustomInputs');
      if (customInputs) customInputs.style.display = mode === 'custom' ? 'block' : 'none';
    }

    function crPickerConfirm() {
      if (!selectedMode) { alert('Please select a date range.'); return; }

      let start, end, label;

      if (selectedMode === 'today') {
        ({ start, end } = localDayBounds(today));
        label = today.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

      } else if (selectedMode === 'week') {
        const weekStart = new Date(today);
        weekStart.setDate(today.getDate() - today.getDay()); // back to Sunday
        ({ start } = localDayBounds(weekStart));
        ({ end }   = localDayBounds(today));
        const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        label = `${fmt(weekStart)}–${fmt(today)}, ${today.getFullYear()}`;

      } else if (selectedMode === 'custom') {
        const startStr = document.getElementById('crStart').value;
        const endStr   = document.getElementById('crEnd').value;
        if (!startStr || !endStr) { alert('Please enter both a start and end date.'); return; }
        const startDate = parseLocalDate(startStr);
        const endDate   = parseLocalDate(endStr);
        if (endDate < startDate) { alert('End date must be on or after start date.'); return; }
        ({ start } = localDayBounds(startDate));
        ({ end }   = localDayBounds(endDate));
        const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        label = `${fmt(startDate)} – ${fmt(endDate)}`;

      } else {
        // All Time — no bounds; server returns every row
        start = null; end = null; label = 'All Time';
      }

      cleanup();
      resolve({ start, end, label });
    }

    function crPickerCancel() {
      cleanup();
      resolve(null);
    }

    function cleanup() {
      delete window.crPickerSelect;
      delete window.crPickerConfirm;
      delete window.crPickerCancel;
      const el = document.getElementById('campaignDatePicker');
      if (el) el.remove();
    }

    window.crPickerSelect  = crPickerSelect;
    window.crPickerConfirm = crPickerConfirm;
    window.crPickerCancel  = crPickerCancel;
  });
}

// Open a print window, write the report HTML, and trigger Print → Save as PDF.
function printReportHtml(html) {
  const win = window.open('', '_blank', 'width=800,height=700');
  if (!win) {
    alert('Pop-up blocked. Allow pop-ups for this page and try again.');
    return;
  }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 600);
}


/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  try {
    await loadCfg();

    // Self-hosted: auto-wire the endpoint so organizers never have to paste it
    if (typeof APPS_SCRIPT_URL === 'string' && APPS_SCRIPT_URL.startsWith('http')) {
      cfg.endpoint = APPS_SCRIPT_URL;
      await saveCfg();
    }

    // Volunteer config import.
    // Resolution order (newest-to-oldest, all legacy formats still work):
    //   ?c=<slug>   -- centralized multi-tenant campaign id (Phase 2+)
    //   ?d=<id>     -- raw Apps Script deployment ID (no encoding needed)
    //   ?ep=<b64>   -- base64(endpointUrl), legacy since 2024
    //   ?cfg=<b64>  -- base64(fullConfig),  legacy before server-side config
    const urlParams = new URLSearchParams(window.location.search);
    const cParam    = urlParams.get('cid');
    const dParam    = urlParams.get('d');
    const epParam   = urlParams.get('ep');
    const cfgParam  = urlParams.get('cfg');

    async function importFromEndpoint(endpoint, campaignId) {
      const cSuffix = campaignId ? '&cid=' + encodeURIComponent(campaignId) : '';
      const res    = await fetch(endpoint + '?action=getConfig' + cSuffix);
      const data   = await res.json();
      if (data.ok && data.config) {
        const imported       = JSON.parse(data.config);
        const savedCanvasser = cfg.canvasser;
        Object.assign(cfg, imported);
        cfg.canvasser = savedCanvasser;
        await saveCfg();
      }
      history.replaceState(null, '', window.location.pathname);
    }

    if (cParam) {
      // Centralized model: slug routes to the right customer Sheet.
      // Store the campaign id and fetch the campaign's config from the
      // shared endpoint. The endpoint is already wired above from APPS_SCRIPT_URL.
      try {
        cfg.campaignId = cParam;
        await saveCfg();
        await importFromEndpoint(APPS_SCRIPT_URL, cParam);
      } catch(e) {
        console.warn('Config fetch from campaign id failed:', e);
      }
    } else if (dParam) {
      // Deployment ID: reconstruct the full endpoint URL on the client.
      try {
        const endpoint = 'https://script.google.com/macros/s/' + dParam + '/exec';
        await importFromEndpoint(endpoint);
      } catch(e) {
        console.warn('Config fetch from deployment ID failed:', e);
      }
    } else if (epParam) {
      // Legacy ?ep= -- base64(endpointUrl), used before the ?d= format.
      try {
        const endpoint = decodeURIComponent(escape(atob(epParam)));
        await importFromEndpoint(endpoint);
      } catch(e) {
        console.warn('Config fetch from legacy ep param failed:', e);
      }
    } else if (cfgParam) {
      // Legacy ?cfg= -- base64(fullConfig), used before server-side config.
      try {
        const imported       = JSON.parse(decodeURIComponent(escape(atob(cfgParam))));
        const savedCanvasser = cfg.canvasser;
        Object.assign(cfg, imported);
        cfg.canvasser = savedCanvasser;
        await saveCfg();
        history.replaceState(null, '', window.location.pathname);
      } catch(e) {
        console.warn('Config import from legacy cfg param failed:', e);
      }
    }

    await loadLog();
    await loadAuth();

    if (auth.approved && auth.email) {
      // Already signed in on this device — skip straight to the app.
      enterApp();
    } else {
      // Always show the explicit "Sign in with Google" button, even when
      // running inside Apps Script. We used to try silent server-side
      // detection via Session.getActiveUser() here, but that call returns
      // an empty email for a lot of real visitors (different browser
      // profile, not actively signed into Google at that moment, etc.),
      // which showed them a dead-end "Could not verify your identity"
      // screen with nothing to click. The explicit button always works,
      // and checkApproved() still uses google.script.run under the hood
      // to check the Approved Volunteers tab once they pick an account.
      showSignin();
    }
  } catch (err) {
    console.error('Boot failed:', err);
    document.getElementById('signinWrap').hidden = true;
    document.getElementById('appWrap').hidden = false;
    renderFatalError(err, 'boot');
  }
})();
</script>
